<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f2a1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Sequence Online</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>html,body{margin:0;background:#0e281d;color:#fff;font:16px system-ui,sans-serif}#app>p{text-align:center;padding-top:40vh;color:#9db8aa}</style>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
  <div id="app"><p>Loading…</p></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modal" hidden></div>
  <div id="popup" aria-live="assertive"></div>
  <script>
  /* Cache-proof loader: GitHub Pages caches files for ~10 minutes, so we ask for the tiny version.txt with
     "no-store" on every page load and load every other file with ?v=<that version>. A new deploy is picked up on the next refresh. */
  (function () {
    var files = ['vendor/mqtt.min.js', 'transport.js', 'game.js', 'app.js'];
    function fail() { var a = document.getElementById('app'); a.innerHTML = '<p>Could not load the game. Check your internet and reload.</p>'; }
    function go(v) {
      window.SEQ_VER = v;
      var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'style.css?v=' + v; document.head.appendChild(l);
      (function next(i) {
        if (i >= files.length) return;
        var s = document.createElement('script'); s.src = files[i] + '?v=' + v;
        s.onload = function () { next(i + 1); }; s.onerror = fail; document.body.appendChild(s);
      })(0);
    }
    var cached = null; try { cached = localStorage.getItem('seq_ver'); } catch (e) { /* ignore */ }
    fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('v'); return r.text(); })
      .then(function (t) { t = (t || '').trim() || '0'; try { localStorage.setItem('seq_ver', t); } catch (e) { /* ignore */ } go(t); })
      .catch(function () { go(cached || '0'); });
  })();
  </script>
</body>
</html>
